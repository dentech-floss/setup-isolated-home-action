name: Test Action

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The action runs index.js/post.js directly with the committed node_modules, so there is no build step
      - name: Test action
        id: isolated
        uses: ./

      - name: Verify HOME is isolated
        env:
          ISOLATED_HOME: ${{ steps.isolated.outputs.isolated-home }}
        run: |
          echo "HOME is set to: $HOME"
          if [ -z "$ISOLATED_HOME" ] || [ "$HOME" != "$ISOLATED_HOME" ]; then
            echo "ERROR: HOME ($HOME) is not the isolated HOME ($ISOLATED_HOME)"
            exit 1
          fi
